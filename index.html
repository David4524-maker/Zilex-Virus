<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zilex Virus Simulator</title>
<style>
  :root{
    --bg:#060a08; --panel:#0b120e; --line:#1c2b22;
    --text:#c9f5d4; --dim:#5f8a70; --accent:#39ff8f; --warn:#ffb347;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .crt{
    width:100%; max-width:680px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px;
    box-shadow:0 0 0 1px rgba(57,255,143,.05), 0 20px 60px rgba(0,0,0,.5);
    overflow:hidden; position:relative;
  }
  .bar{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-bottom:1px solid var(--line); background:#0a0f0c; flex-wrap:wrap;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:#27392f;}
  .bar span.title{margin-left:8px; color:var(--dim); font-size:12px; letter-spacing:.03em;}
  .bar .controls{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:11px; color:var(--dim);}
  .bar select{background:#0e1613; color:var(--text); border:1px solid var(--line); border-radius:5px; font-size:11px; padding:3px 5px;}
  .bar label{display:flex; align-items:center; gap:4px;}
  .screen{padding:20px; min-height:380px; font-size:14px; line-height:1.7;}
  .line{white-space:pre-wrap; word-break:break-word;}
  .line.ok{color:var(--accent);}
  .line.warn{color:var(--warn);}
  .cursor{display:inline-block; width:8px; height:14px; background:var(--accent); vertical-align:-2px; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .progress{height:6px; background:#10221a; border-radius:3px; overflow:hidden; margin:2px 0 12px;}
  .progress > div{height:100%; width:0%; background:var(--accent); transition:width .12s linear;}
  .footer{padding:14px 20px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .footer p{margin:0; color:var(--dim); font-size:12px;}
  .footer .btns{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    background:var(--accent); color:#06150c; border:none; border-radius:6px;
    padding:9px 14px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
  }
  button.secondary{background:transparent; color:var(--text); border:1px solid var(--line);}
  button:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
  button:disabled{opacity:.4; cursor:default;}
  .hint{padding:0 20px 14px; margin:0; color:var(--dim); font-size:11px;}
  .glitch{animation:glitchFlicker .12s steps(2) 3;}
  @keyframes glitchFlicker{
    0%{opacity:1; filter:none;} 50%{opacity:.55; filter:hue-rotate(25deg) saturate(2);} 100%{opacity:1; filter:none;}
  }
  .confetti{position:absolute; top:40%; left:50%; font-size:18px; pointer-events:none;
    animation:pop 1s ease-out forwards;}
  @keyframes pop{ to{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;} .glitch{animation:none;} .progress > div{transition:none;} .confetti{display:none;}
  }
</style>
</head>
<body>
  <main class="crt" id="crt">
    <div class="bar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span class="title">zilex_virus.exe — simulación, no es real</span>
      <div class="controls">
        <label for="intensity">Intensidad</label>
        <select id="intensity">
          <option value="suave">Suave</option>
          <option value="normal" selected>Normal</option>
          <option value="supremo">Supremo</option>
        </select>
        <label><input type="checkbox" id="soundToggle"> Sonido</label>
      </div>
    </div>
    <div class="screen" id="screen" aria-live="polite"></div>
    <div class="footer">
      <p id="status">Listo para iniciar la broma. Ejecuciones: <span id="runCount">0</span></p>
      <div class="btns">
        <button id="copyBtn" class="secondary" disabled>Copiar transcripción</button>
        <button id="skipBtn" class="secondary" disabled>Saltar</button>
        <button id="btn">Ejecutar Zilex Virus</button>
      </div>
    </div>
    <p class="hint">Mensajes aleatorios en cada ejecución · Esc o "Saltar" adelanta la animación</p>
  </main>

<script>
(function(){
  const screen = document.getElementById('screen');
  const btn = document.getElementById('btn');
  const skipBtn = document.getElementById('skipBtn');
  const copyBtn = document.getElementById('copyBtn');
  const status = document.getElementById('status');
  const crt = document.getElementById('crt');
  const intensitySel = document.getElementById('intensity');
  const soundToggle = document.getElementById('soundToggle');
  const runCountEl = document.getElementById('runCount');

  const LEVELS = {
    suave:   {n:7,  speed:26, glitch:false},
    normal:  {n:11, speed:16, glitch:true},
    supremo: {n:15, speed:9,  glitch:true},
  };

  const poolRest = [
    {t:"Zilex ha poseído tu mouse (es broma, todo sigue bien)"},
    {t:"Descargando más RAM desde la nube... [#####-----] 48%"},
    {t:"Tu teclado aprendió a escribir con acento chileno"},
    {t:"Alerta: nivel de awesomeness crítico detectado", c:"warn"},
    {t:"Invocando al Zilex supremo..."},
    {t:"Tu PC ahora cree que es una tostadora"},
    {t:"Cargando chiste malo número 4..."},
    {t:"Buscando el sentido de la vida en la Papelera de reciclaje"},
    {t:"Entrenando una IA para que te haga la tarea"},
    {t:"Probabilidad altísima de que esto sea solo una broma"},
    {t:"Autodestruyendo este mensaje en 3, 2, 1... (mentira)", c:"warn"},
    {t:"Sincronizando tus calcetines perdidos..."},
    {t:"Tu mouse ha solicitado vacaciones"},
    {t:"Compilando excusas para no hacer la tarea"},
    {t:"El antivirus se ríe de este virus", c:"ok"},
    {t:"Zilex está pensando en un número del 1 al infinito"},
    {t:"Reiniciando el sentido común de tu PC"},
    {t:"Tu wifi ahora transmite buenas vibras", c:"ok"},
    {t:"Nivel de bromas: supremo desbloqueado", c:"warn"},
    {t:"Verificando si tu café sigue caliente..."},
    {t:"Tu impresora fantasma imprimió un meme"},
    {t:"Actualizando el firmware de tu buen humor"},
    {t:"Zilex encontró un bug... en tu jardín"},
    {t:"Calculando cuántos memes caben en 1GB"},
    {t:"Tu mouse ganó una medalla de oro"},
    {t:"Versión instalada: Zilex Ultra Broma Edition"},
    {t:"Nada que ver aquí, solo risas"},
    {t:"Tu PC solicitó una siesta de 5 minutos (denegada)"},
    {t:"Fin del escaneo: 0 virus reales encontrados", c:"ok"},
  ];

  let running = false;
  let skip = false;
  let runs = 0;
  let audioCtx = null;

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

  function beep(){
    if (!soundToggle.checked) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 760; g.gain.value = 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.05);
    }catch(e){}
  }

  async function typeLine(text, cls, speed){
    beep();
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    screen.appendChild(div);
    for (let i = 0; i < text.length; i++){
      if (skip){ div.textContent = text; break; }
      div.textContent += text[i];
      screen.scrollTop = screen.scrollHeight;
      await sleep(speed);
    }
    div.textContent = text;
  }

  async function animateProgress(){
    const wrap = document.createElement('div');
    wrap.className = 'progress';
    const bar = document.createElement('div');
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    for (let p = 0; p <= 100; p += 10){
      if (skip){ bar.style.width = '100%'; break; }
      bar.style.width = p + '%';
      await sleep(30);
    }
    await sleep(120);
    wrap.remove();
  }

  function confettiBurst(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const emojis = ['✨','🎉','😄','👻'];
    for (let i = 0; i < 10; i++){
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = emojis[i % emojis.length];
      const angle = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 60;
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      s.style.setProperty('--rot', (Math.random() * 360) + 'deg');
      crt.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }

  function finish(total){
    const reveal = document.createElement('div');
    reveal.className = 'line ok';
    reveal.style.marginTop = '8px';
    reveal.innerHTML = 'Tranquilo/a :) Esto fue el <strong>ZILEX VIRUS</strong>, una broma 100% inofensiva.<br>No se tocó ni un archivo real — ' + total + '/' + total + ' bromas entregadas. <span class="cursor"></span>';
    screen.appendChild(reveal);
    runs++; runCountEl.textContent = runs;
    status.textContent = 'Terminado — fue solo una broma. Ejecuciones: ' + runs;
    btn.disabled = false; btn.textContent = 'Repetir broma';
    skipBtn.disabled = true; copyBtn.disabled = false;
    confettiBurst();
    running = false;
  }

  async function run(){
    if (running) return;
    running = true; skip = false;
    btn.disabled = true; skipBtn.disabled = false; copyBtn.disabled = true;
    screen.innerHTML = '';
    status.textContent = 'Ejecutando...';

    const level = LEVELS[intensitySel.value] || LEVELS.normal;
    if (level.glitch) crt.classList.add('glitch');
    await animateProgress();
    crt.classList.remove('glitch');

    const mensajes = [
      {t:"Iniciando Zilex Virus Simulator...", c:"ok"},
      ...shuffle([...poolRest]).slice(0, level.n)
    ];

    for (let i = 0; i < mensajes.length; i++){
      status.textContent = 'Ejecutando... (' + (i + 1) + '/' + mensajes.length + ')';
      await typeLine(mensajes[i].t, mensajes[i].c, level.speed);
      if (!skip) await sleep(110);
    }
    finish(mensajes.length);
  }

  function skipNow(){ if (running) skip = true; }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') skipNow(); });
  skipBtn.addEventListener('click', skipNow);
  btn.addEventListener('click', run);
  copyBtn.addEventListener('click', async () => {
    const text = [...screen.querySelectorAll('.line')].map(l => l.textContent).join('\n');
    try{ await navigator.clipboard.writeText(text); copyBtn.textContent = 'Copiado ✓'; }
    catch(e){ copyBtn.textContent = 'No se pudo copiar'; }
    setTimeout(() => copyBtn.textContent = 'Copiar transcripción', 1500);
  });
})();
</script>
</body>
</html>
